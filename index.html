<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saldo Kas Takmir Masjid An-Nuur Kotagede</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="pattern-band"></div>

<header class="hero">
  <img class="logo" src="assets/logo.png" alt="Logo masjid">
  <h1>Saldo Kas Takmir</h1>
  <p class="sub">Masjid An-Nuur Kotagede</p>
</header>

<main>
  <div class="balance-card">
    <img class="balance-icon" src="assets/wallet.svg" alt="Ikon kas">
    <p class="balance-label">Saldo Kas Saat Ini</p>
    <p class="balance-amount">Rp 18.690.208</p>
    <p class="balance-updated">Diperbarui 26 September 2026</p>

    <div class="divider"></div>

    <p class="note">Laporan kas disusun oleh Bendahara Takmir dan dapat diperiksa sewaktu-waktu oleh jamaah.</p>
  </div>
</main>

<footer>
  <p class="masjid">Masjid An-Nuur Kotagede</p>
  <p>Untuk rincian pemasukan &amp; pengeluaran, hubungi Bendahara Takmir.</p>
</footer>

</body>
</html>
